<!DOCTYPE html>

  <script src="js/auth.js"></script>

    document.addEventListener('DOMContentLoaded', () => {
      const session = LANDGUARD_AUTH.getSession();

      } else {
        window.location.href = 'login.html';
      }
    });
  </script>
